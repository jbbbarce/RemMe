[package]
name = "remme"
version = "0.18.0"
description = "RemMe: a Windows reminders app with a floating, lockable list"
license = "MIT"
authors = ["John Barce"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "remme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# Coach's voice (0.18.0): Kokoro on ONNX Runtime, built in; misaki-rs without espeak-ng (docs/adr/0003).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "api-22", "tls-native"] }
misaki-rs = { version = "=0.11.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# The same version Tauri uses: handing focus back after showing the floating list, title bar
# colours, rounded corners and the Windows accent colour.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "UI", "UI_ViewManagement"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# The toast library the notification plugin uses; called directly for buttons and reminder-style popups.
tauri-winrt-notification = "0.8.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
